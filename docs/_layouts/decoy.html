<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,maximum-scale=2">
    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" type="text/css" media="screen" href="{{ '/assets/css/decoy.css' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/assets/decoy.png' | relative_url }}">
    <title>{{ page.title | default: "Privacy Policy" }} | Decoy — Live Break Assistant</title>
  </head>
  <body>
    <div id="header_wrap" class="outer">
      <header class="inner">
        <a class="brand" href="{{ '/live-break-assistant/' | relative_url }}">
          <img src="{{ '/assets/decoy.png' | relative_url }}" width="64" height="64" alt="Decoy">
          <div class="brand-text">
            <h1 id="project_title">Decoy — Live Break Assistant</h1>
            <h2 id="project_tagline">Blue Luchador LLC — Legal Terms and Policies</h2>
          </div>
        </a>
      </header>
    </div>
    <div id="main_content_wrap" class="outer">
      <section id="main_content" class="inner">
        {{ content }}
      </section>
    </div>
    <div id="footer_wrap" class="outer">
      <footer class="inner">
        <p>Published with <a href="https://pages.github.com">GitHub Pages</a></p>
      </footer>
    </div>
  </body>
</html>
